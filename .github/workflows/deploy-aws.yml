# Auto-deploy to AWS.
#
#   main -> ghcr.io image -> EC2 instance -> https://pablocabrera.dev
#
# main ONLY, by design: develop/beta stays on deploy-k3s.yml. At cutover,
# deploy-k3s.yml drops main from its trigger and this workflow becomes the
# production path (see infra/README.md, step 8).
#
# Two jobs. Build runs on GitHub's runners and pushes to GHCR with the
# built-in GITHUB_TOKEN — no registry secrets. Deploy assumes an AWS IAM role
# through OIDC federation (infra/terraform/github-oidc.tf) — no AWS keys
# stored in GitHub either — and tells the instance to pull and restart via
# SSM Run Command, so the instance needs no open SSH and no webhook listener.
#
# Activation: the deploy job is SKIPPED until three repository *variables*
# exist (Settings -> Secrets and variables -> Actions -> Variables tab):
#
#   AWS_DEPLOY_ROLE_ARN   terraform output -raw deploy_role_arn
#   AWS_INSTANCE_ID       terraform output -raw instance_id
#   AWS_REGION            e.g. us-east-1
#
# Until then, pushes to main still build and publish the image, which is
# harmless and pre-warms GHCR before the migration. Variables, not secrets:
# none of the three values is sensitive, and variables show up in logs where
# secrets would be masked into unreadable stars.
name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push to GHCR
  id-token: write # mint the OIDC token the AWS role trusts

concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  # GHCR requires a lowercase owner; the account is Mrroboto9819.
  IMAGE: ghcr.io/mrroboto9819/portfolio-webapp-v1-2026-2027

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve tag
        id: meta
        run: echo "tag=$(printf %.7s "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # The same production target the k3s workflow builds for main:
          # source maps stripped, config injected at run time only.
          target: production
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Skipped, not failed, until the AWS side exists — see the header.
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_INSTANCE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Assume the deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Roll the instance
        env:
          TAG: ${{ needs.build.outputs.tag }}
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
        run: |
          set -euo pipefail

          # portafolio-redeploy (installed by infra/terraform/user_data.sh)
          # refreshes secrets from SSM, pulls the tag, restarts the systemd
          # unit, and health-checks /api/v1/health for "db":true — the same
          # gate the k3s smoke test enforces. Its exit code is the deploy's.
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $TAG" \
            --parameters "commands=[\"/usr/local/bin/portafolio-redeploy $TAG\"]" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          while :; do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          echo "---- instance output ----"
          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}' \
            --output json
          [ "$STATUS" = "Success" ]
