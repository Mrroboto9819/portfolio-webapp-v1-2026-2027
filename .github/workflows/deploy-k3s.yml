# Auto-deploy to the k3s cluster.
#
#   develop -> portafolio-beta -> https://beta.pablocabrera.dev
#   main    -> portafolio-web  -> https://pablocabrera.dev
#
# Same job, same runner, same image build; only the target deployment and the
# Dockerfile stage differ. One workflow rather than two because a production
# path that diverges from the one exercised daily on beta is a path nobody has
# actually tested.
#
# Runs on an in-cluster self-hosted runner (see k8s/ci/runner.yaml on the
# server). The runner pod mounts the k3s containerd socket, so it can build
# the image and load it straight into the kubelet's image cache — this
# cluster has no registry, and the deployment runs imagePullPolicy: Never.
#
# Manifests are deliberately NOT applied here: k8s/ is gitignored, so CI
# cannot see it. CI only rolls the image tag forward on the deployment that
# already exists. Changing a manifest is a deliberate `kubectl apply` on the
# server, which is the right blast radius for cluster config.
name: Deploy to k3s

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  # Per-branch, so a production deploy is never cancelled by a beta push.
  group: deploy-k3s-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, portfolio-webapp]
    timeout-minutes: 30
    defaults:
      run:
        # bash explicitly: the runner defaults to sh here, where ${VAR::7} and
        # `pipefail` are syntax errors that abort a step in milliseconds with
        # no useful message.
        shell: bash
    env:
      IMAGE_REPO: portfolio-webapp
      APP_NS: portafolio
      CONTAINER: portafolio
      CONTAINERD_SOCK: /run/k3s/containerd/containerd.sock

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        # myoung34/github-runner ships buildah and ctr but not kubectl, and
        # the rollout/smoke-test/rollback steps all need it. Cached on the
        # runner's filesystem, so this is a no-op after the first job.
        run: |
          set -euo pipefail
          if ! command -v kubectl >/dev/null; then
            KUBE_VER=$(curl -sL https://dl.k8s.io/release/stable.txt)
            curl -sLo /tmp/kubectl "https://dl.k8s.io/release/${KUBE_VER}/bin/linux/amd64/kubectl"
            install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
            rm -f /tmp/kubectl
          fi
          kubectl version --client --output=yaml | head -3

      - name: Resolve target
        id: target
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "app=portafolio-web"  >> "$GITHUB_OUTPUT"
            echo "stage=production"    >> "$GITHUB_OUTPUT"
            echo "url=https://pablocabrera.dev" >> "$GITHUB_OUTPUT"
          else
            echo "app=portafolio-beta" >> "$GITHUB_OUTPUT"
            echo "stage=stage"         >> "$GITHUB_OUTPUT"
            echo "url=https://beta.pablocabrera.dev" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$(printf %.7s "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Announce
        run: |
          echo "branch : $GITHUB_REF_NAME"
          echo "target : ${{ steps.target.outputs.app }} (${{ steps.target.outputs.stage }})"
          echo "image  : ${IMAGE_REPO}:${{ steps.target.outputs.tag }}"

      - name: Build image
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # buildah, not docker: the runner is a pod, and asking it to talk to
          # a docker daemon means either mounting the host socket (root on the
          # node for anything that can write a Dockerfile) or docker-in-docker.
          #
          # Tagged with the docker.io/library/ prefix even though NOTHING is
          # pushed to any registry. It is a purely local name: kubelet
          # canonicalises the bare `portfolio-webapp:TAG` in the manifest to
          # `docker.io/library/portfolio-webapp:TAG` before looking it up, and
          # under imagePullPolicy: Never it only ever consults the node's own
          # content store. Tag it any other way and the image is present but
          # invisible to the kubelet.
          buildah bud --isolation chroot --target "$TARGET" \
            -t "docker.io/library/${IMAGE_REPO}:${TAG}" .

      - name: Load into the node's containerd
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          IMAGE="docker.io/library/${IMAGE_REPO}:${TAG}"
          TAR="/tmp/${IMAGE_REPO}-${TAG}.tar"

          # docker-archive, not oci-archive, and no --base-name. An OCI archive
          # carries its name in a ref annotation that ctr combines with
          # --base-name; give it a fully-qualified base name and it silently
          # imports NOTHING while still exiting 0, so the breakage only shows up
          # five minutes later as a rollout timeout. A docker-archive carries
          # RepoTags, which ctr honours verbatim.
          #
          # Nothing leaves the machine: buildah writes a tar, ctr reads that tar
          # into the node's containerd over the mounted socket. No registry, no
          # credentials, no network.
          buildah push "$IMAGE" "docker-archive:${TAR}:${IMAGE}"
          ctr --address "$CONTAINERD_SOCK" -n k8s.io images import "$TAR"
          rm -f "$TAR"

          # Verify before rolling. A missing image would otherwise surface as
          # ErrImageNeverPull only after the rollout burns its full timeout.
          #
          # Collected into a variable and matched with a here-string rather than
          # piped into `grep -q`. Under `set -o pipefail` that pipe reports a
          # FALSE NEGATIVE on success: grep -q exits at the first match and
          # closes the pipe, ctr dies of SIGPIPE (141), pipefail surfaces 141 as
          # the pipeline's status, and `!` turns the successful match into a
          # failure. A here-string involves no pipe and no second process.
          IMAGES=$(ctr --address "$CONTAINERD_SOCK" -n k8s.io images ls -q)
          if ! grep -qxF "$IMAGE" <<<"$IMAGES"; then
            echo "::error::$IMAGE missing from the node's containerd after import"
            grep -F "$IMAGE_REPO" <<<"$IMAGES" || true
            exit 1
          fi
          echo "$IMAGE present on the node"

      - name: Roll the deployment
        env:
          TAG: ${{ steps.target.outputs.tag }}
          APP: ${{ steps.target.outputs.app }}
        run: |
          set -euo pipefail
          kubectl -n "$APP_NS" set image \
            "deployment/$APP" "$CONTAINER=${IMAGE_REPO}:${TAG}"
          kubectl -n "$APP_NS" rollout status "deployment/$APP" --timeout=420s

      - name: Smoke test
        env:
          APP: ${{ steps.target.outputs.app }}
        run: |
          set -euo pipefail
          POD=$(kubectl -n "$APP_NS" get pod -l "app=$APP" \
            -o jsonpath='{.items[0].metadata.name}')
          # bun, not node: the runtime image is oven/bun. It does ship a node
          # fallback shim, but that is a Bun implementation detail, not a
          # contract — and there is no curl or wget in the image either.
          BODY=$(kubectl -n "$APP_NS" exec "$POD" -- \
            bun -e 'fetch("http://127.0.0.1:3000/api/v1/health").then(r=>r.text()).then(console.log)')
          echo "$BODY"
          case "$BODY" in *'"db":true'*) echo "healthy";; *) echo "UNHEALTHY"; exit 1;; esac

      - name: Roll back on failure
        if: failure()
        env:
          APP: ${{ steps.target.outputs.app }}
        run: |
          set -uo pipefail
          # Only roll back to a revision that can actually run.
          #
          # `rollout undo` blindly reverts to the previous revision, and on a
          # freshly applied manifest that revision is the placeholder
          # `:latest` — an image no node has, so the rollback itself produces
          # ErrImageNeverPull and takes the deployment down harder than the
          # failure did. This checks the target image exists on the node first
          # and otherwise leaves the running pod alone.
          PREV=$(kubectl -n "$APP_NS" rollout history "deployment/$APP" --revision=0 2>/dev/null \
            | tail -2 | head -1 | awk '{print $1}')
          IMG=$(kubectl -n "$APP_NS" rollout history "deployment/$APP" --revision="${PREV:-0}" 2>/dev/null \
            | grep -oE 'portfolio-webapp:[^ ]+' | head -1)

          if [ -z "$IMG" ] || [ "$IMG" = "${IMAGE_REPO}:latest" ]; then
            echo "No usable previous revision (${IMG:-none}); leaving the current pod running."
            exit 0
          fi

          if ! ctr --address "$CONTAINERD_SOCK" -n k8s.io images ls -q | grep -q "$IMG"; then
            echo "Previous image $IMG is not present on this node; not rolling back."
            exit 0
          fi

          echo "Rolling ${APP} back to ${IMG}."
          kubectl -n "$APP_NS" set image "deployment/$APP" "$CONTAINER=$IMG"
          kubectl -n "$APP_NS" rollout status "deployment/$APP" --timeout=180s || true

      - name: Done
        run: echo "Deployed ${{ steps.target.outputs.app }} -> ${{ steps.target.outputs.url }}"

      - name: Notify Discord
        # Runs on every outcome — success, failure and cancellation — so the
        # channel reflects reality instead of only the happy path. Placed last
        # and guarded with always() so it still fires after "Roll back on
        # failure" has done its work, and reports the job's real status.
        #
        # WEBHOOK_DC is a repository secret (Settings -> Secrets and variables
        # -> Actions). NOT an environment secret: this job declares no
        # `environment:`, so an environment-scoped secret would resolve to an
        # empty string and the notification would silently vanish.
        if: always()
        env:
          WEBHOOK_DC: ${{ secrets.WEBHOOK_DC }}
          STATUS: ${{ job.status }}
          TAG: ${{ steps.tag.outputs.tag }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail

          if [ -z "${WEBHOOK_DC:-}" ]; then
            echo "::warning::WEBHOOK_DC is not set — skipping Discord notification."
            echo "Add it under Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 0
          fi

          case "$STATUS" in
            success)   COLOR=3066993;  TITLE="✅ Deploy succeeded" ;;
            failure)   COLOR=15158332; TITLE="❌ Deploy failed — rolled back" ;;
            cancelled) COLOR=9807270;  TITLE="⚪ Deploy cancelled" ;;
            *)         COLOR=10181046; TITLE="❔ Deploy finished: ${STATUS}" ;;
          esac

          # Only the first line of the commit subject — Discord field values
          # cap at 1024 chars and a long body makes the embed unreadable.
          SUBJECT=$(printf '%s' "${COMMIT_MSG:-}" | head -n1 | cut -c1-180)

          # jq builds the payload so commit subjects containing quotes,
          # backslashes or unicode can't produce malformed JSON.
          PAYLOAD=$(jq -n \
            --arg title    "$TITLE" \
            --arg env      "beta (${TARGET})" \
            --arg branch   "${GITHUB_REF_NAME}" \
            --arg commit   "\`${GITHUB_SHA:0:7}\` ${SUBJECT}" \
            --arg image    "${IMAGE_REPO}:${TAG:-unknown}" \
            --arg target   "${APP_NS}/${APP}" \
            --arg actor    "$ACTOR" \
            --arg url      "$RUN_URL" \
            --argjson color "$COLOR" \
            '{
              username: "k3s deploy",
              embeds: [{
                title: $title,
                url: $url,
                color: $color,
                fields: [
                  { name: "Environment", value: $env,    inline: true },
                  { name: "Branch",      value: $branch, inline: true },
                  { name: "Image",       value: $image,  inline: true },
                  { name: "Deployment",  value: $target, inline: true },
                  { name: "By",          value: $actor,  inline: true },
                  { name: "Commit",      value: $commit, inline: false }
                ],
                footer: { text: "portfolio-webapp-2026-2027" }
              }]
            }')

          # Never let a webhook hiccup flip a green deploy red: report the
          # HTTP code, but always exit 0. Discord returns 204 on success.
          CODE=$(curl -sS -o /tmp/discord-resp.txt -w '%{http_code}' \
            --retry 3 --retry-delay 2 --max-time 15 \
            -H 'Content-Type: application/json' \
            -X POST -d "$PAYLOAD" "$WEBHOOK_DC") || CODE=000

          if [ "$CODE" = "204" ] || [ "$CODE" = "200" ]; then
            echo "Discord notified (HTTP $CODE)"
          else
            echo "::warning::Discord webhook returned HTTP $CODE"
            head -c 500 /tmp/discord-resp.txt || true
          fi
